<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F1A">
<title>Finan League · Cómo funciona</title>
<meta name="description" content="Vídeo de 1 minuto y medio que explica cómo funciona Finan League.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap">
<style>
:root{--bg:#0E0F1A;--fg:#F2F2F7;--muted:#A3A6BF;--lime:#C6F432;--lime-hi:#E2FF7A;--ink:#0E0F1A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
 padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 15px 'Bricolage Grotesque',sans-serif}
.word{font:800 22px 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
h1{margin:0;font:800 26px/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
video{width:100%;max-height:72vh;border-radius:18px;background:#000;display:block}
.btn{min-height:52px;border-radius:14px;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{background:var(--lime-hi)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
p{margin:0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo" aria-hidden="true">FL</div><div class="word">Finan League</div></div>
  <h1>Así funciona Finan League</h1>
  <video poster="assets/poster.jpg" controls playsinline preload="metadata">
    <source src="assets/video.mp4" type="video/mp4">
    <source src="assets/video.webm" type="video/webm">
    Tu navegador no puede reproducir este vídeo. <a href="assets/video.mp4">Descárgalo aquí</a>.
  </video>
  <a class="btn" href="./">Jugar ahora</a>
  <p>Prototipo · Creación e Innovación · MBA EDEM</p>
</main>
</body>
</html>
