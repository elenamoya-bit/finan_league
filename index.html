<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Finan League</title>
<meta name="description" content="Prototipo de Finan League: aprende a gestionar tu dinero compitiendo en una liga con 10.000 Curritos.">
<style>html,body{margin:0}*{-webkit-tap-highlight-color:transparent}.vmodal{position:absolute;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
.vmodal video{width:100%;height:100%;object-fit:contain;background:#000}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(242,242,247,.9);color:#0E0F1A;font-size:22px;font-weight:700;cursor:pointer;z-index:61}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: presenter notes beside a phone-sized working app; on phones the app takes the whole width. Single dark look matching the Finan League mockup. */
:root{
  --bg:#0A0B14; --app:#0E0F1A; --panel:#141526; --card:#181A2B; --raise:#23253A; --line:#2A2D45;
  --fg:#F2F2F7; --soft:#C9CBE0; --muted:#A3A6BF;
  --lime:#C6F432; --lime-hi:#E2FF7A; --lime-bg:#1E2410; --lime-chip:#23301A; --ink:#0E0F1A;
  --violet:#8B7CFF; --violet-soft:#C9C3FF; --violet-bg:#1A1830;
  --coral:#FF8A65; --coral-text:#FFB199; --coral-bg:#2A1B16;
  --gold:#FFD166; --silver:#C9CBE0; --bronze:#E0A07A;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.stage{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;justify-content:center}
.notes{flex:1 1 320px;min-width:0;max-width:460px;display:flex;flex-direction:column;gap:22px;padding-top:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.5px}
.word{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.5px}
.notes h1{font-size:clamp(32px,4vw,46px);line-height:1}
.notes h1 span{color:var(--lime)}
.lede{color:var(--muted);font-size:16px;max-width:60ch}
.howto{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none;counter-reset:s}
.howto li{display:flex;gap:12px;align-items:flex-start;color:var(--soft);font-size:14px}
.howto li::before{counter-increment:s;content:counter(s);flex:0 0 26px;height:26px;border-radius:8px;background:var(--card);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px}
.jump{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.jump-row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.ghost:hover{border-color:var(--violet)}
.fine{font-size:12px;color:var(--muted)}
.coin{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--lime);color:var(--ink);font-family:var(--display);font-weight:800;font-size:.8em;vertical-align:.08em}

.phone{flex:0 1 400px;width:100%;max-width:400px;height:min(840px,calc(100vh - 56px));min-height:640px;border-radius:40px;border:8px solid var(--raise);background:var(--app);display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{flex:1;overflow-y:auto;padding:30px 20px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.tabs{display:flex;justify-content:space-around;align-items:flex-start;padding:10px 4px 14px;background:var(--panel);border-top:1px solid var(--line)}
.tab{min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;background:none;border:0;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--lime);font-weight:700}
.tab svg{width:24px;height:24px}
@media (max-width:900px){.notes{order:2;max-width:400px}}
@media (max-width:460px){
  body{padding-block:12px}
  .phone{height:auto;min-height:0;border:0;border-radius:0;overflow:visible;background:transparent}
  .screen{overflow:visible;padding:8px 0 24px}
  .tabs{position:sticky;bottom:0;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .notif{position:fixed;top:calc(10px + env(safe-area-inset-top,0px))}
}

/* app components */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.muted{color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.04}
.btn{min-height:52px;border-radius:14px;border:0;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;padding:0 16px;text-align:center}
.btn:hover{background:var(--lime-hi)}
.btn[disabled]{background:var(--raise);color:var(--muted);cursor:not-allowed}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--violet)}
.card{border-radius:18px;background:var(--card);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--soft)}
.field input,.field select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--app);padding:0 14px;font-size:15px;width:100%}
.at{position:relative}
.at span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.at input{padding-left:30px}
.opt{border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%}
.opt:hover{border-color:var(--violet)}
.opt[aria-pressed="true"]{border:2px solid var(--lime);background:var(--lime-bg);padding:11px 13px}
.key{flex:0 0 30px;height:30px;border-radius:8px;background:var(--raise);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt[aria-pressed="true"] .key{background:var(--lime);color:var(--ink)}
.opt-t{display:flex;flex-direction:column;gap:2px}
.opt-t b{font-size:15px}
.opt-t span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lime)}
.prog{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.prog i{height:6px;border-radius:99px;background:var(--raise)}
.prog i.done{background:var(--violet)}
.prog i.now{background:var(--lime)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.money{font-family:var(--display);font-weight:800;font-size:19px;text-align:right}
.up{color:var(--lime)} .down{color:var(--coral-text)}
.pin{border:1px solid var(--coral)}
.pin-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-text)}
.news{background:var(--violet);color:var(--ink);border:0}
.news .eyebrow{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--raise);font-size:12px;font-weight:700}
.chip.pos{background:var(--lime-chip);color:var(--lime)}
.chip.neg{background:var(--coral-bg);color:var(--coral-text)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--violet-bg);color:var(--violet-soft);font-size:13px}
.ok{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--lime-bg);color:var(--fg);font-size:14px}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--coral-bg);color:var(--fg);font-size:14px}
.ok svg,.warn svg{flex:0 0 18px;margin-top:2px}
.rank{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rank-row{display:flex;justify-content:space-between;gap:8px}
.rank-row.me{color:var(--lime);font-weight:700}
.disclaimer{font-size:11px;color:var(--muted);text-align:center}
.hero-money{border-radius:22px;background:var(--lime);color:var(--ink);padding:20px;display:flex;flex-direction:column;gap:4px}
.hero-money .amt{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-1.5px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:14px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:800;font-size:22px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days div{border-radius:10px;background:var(--card);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.days b{font-size:15px;color:var(--lime)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--raise);font-size:14px}
.row:last-child{border-bottom:0}
.row>b:last-child,.row>.num:last-child{white-space:nowrap}
[hidden]{display:none!important}

.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl div{border-radius:14px;border:1px solid var(--line);background:var(--card);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.lvl b{font-family:var(--display);font-size:22px}
.lvl div.on{border:2px solid var(--lime);background:var(--lime-bg);color:var(--fg)}
.lvl div.on b{color:var(--lime)}
.badge{align-self:flex-start;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--raise);color:var(--soft)}
.badge.rec{background:var(--lime);color:var(--ink)}
.sc-card{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;width:100%}
.sc-card:hover{border-color:var(--violet)}
.sc-card b{font-size:16px}
.ind{display:flex;flex-direction:column;gap:6px}
.ind-h{display:flex;justify-content:space-between;font-size:14px}
.code{flex:1;height:48px;border-radius:12px;background:var(--app);color:var(--fg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:4px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;padding:12px 14px;border-radius:12px;background:var(--fg);color:var(--ink);font-size:14px;font-weight:500;text-align:center;z-index:30}

/* bank */
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--soft)}
.chart{width:100%;height:auto;display:block}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;padding:8px 4px;text-align:center}
.act svg{width:22px;height:22px;color:var(--lime)}
.act.main{background:var(--lime);color:var(--ink);border:0}
.act.main svg{color:var(--ink)}
.act[aria-expanded="true"]{border-color:var(--lime)}
.icon-box{flex:0 0 44px;height:44px;border-radius:12px;background:var(--lime-bg);color:var(--lime);display:flex;align-items:center;justify-content:center}
.icon-box svg{width:22px;height:22px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px}
.stack i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-direction:column;gap:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.rep{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.mv{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--raise)}
.mv:last-child{border-bottom:0}
.mv-i{flex:0 0 40px;height:40px;border-radius:12px;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--soft)}
.mv-i.news{background:var(--violet-bg);color:var(--violet-soft)}
.mv-i.dec{background:var(--lime-bg);color:var(--lime)}
.mv-i.neg{background:var(--coral-bg);color:var(--coral-text)}
.mv-i svg{width:20px;height:20px}
.mv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mv-t b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-t span{font-size:12px;color:var(--muted)}
.mv-a{font-weight:700;font-size:15px;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--lime);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 80px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--app);cursor:pointer;font-weight:700;font-size:14px}
.seg button:hover{border-color:var(--lime)}

/* retos */
.xpbar{display:flex;flex-direction:column;gap:6px}
.reto{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%}
.reto:hover{border-color:var(--violet)}
.reto.done{opacity:.75}
.reto-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.reto-t b{font-size:15px}
.reto-t span{font-size:13px;color:var(--muted)}
.xp{padding:5px 10px;border-radius:99px;background:var(--violet-bg);color:var(--violet-soft);font-weight:700;font-size:12px;white-space:nowrap}
.xp.got{background:var(--lime-chip);color:var(--lime)}
.slider{display:flex;flex-direction:column;gap:8px}
.slider-h{display:flex;justify-content:space-between;align-items:baseline}
.slider-h b{font-family:var(--display);font-weight:800;font-size:20px}
input[type=range]{width:100%;height:28px;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--app);cursor:pointer;font-size:14px;font-weight:500}
.two button[aria-pressed="true"]{border:2px solid var(--lime);background:var(--lime-bg);font-weight:700}
.two button.right{border:2px solid var(--lime)}
.two button.wrong{border:2px solid var(--coral);background:var(--coral-bg)}

/* profile badge */
.lvbadge{border-radius:22px;padding:18px;background:radial-gradient(120% 120% at 20% 0%,#2C3A12 0%,var(--card) 60%);border:2px solid var(--lime);display:flex;gap:16px;align-items:center}
.hex{flex:0 0 76px;height:84px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:36px}
.hex.off{background:var(--raise);color:var(--muted)}
.minihex{display:flex;gap:10px}
.minihex div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.minihex .hex{flex:0 0 auto;width:40px;height:44px;font-size:18px}
.active-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-self:flex-start}

/* notification + ranking */
.notif{position:absolute;left:10px;right:10px;top:10px;z-index:40;border-radius:20px;background:rgba(36,38,58,.97);border:1px solid #3A3D5E;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;width:auto}
.notif .logo{flex:0 0 38px;font-size:15px}
.notif-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.notif-h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.notif-t b{font-size:14px}
.notif-t span{font-size:13px;color:var(--soft)}
.x{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{width:48px;height:48px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;border:3px solid var(--raise)}
.pod.me .av{border-color:var(--lime);color:var(--lime)}
.pod .nm{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .step{width:100%;border-radius:14px 14px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:var(--ink);font-family:var(--display);font-weight:800;font-size:26px}
.pod .val{font-size:12px;color:var(--soft)}
.mvup{color:var(--lime);font-weight:700;font-size:12px}
.mvdn{color:var(--coral-text);font-weight:700;font-size:12px}
.mveq{color:var(--muted);font-size:12px}
.back{background:none;border:0;color:var(--soft);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0;align-self:flex-start;min-height:44px}
@media (prefers-reduced-motion:no-preference){
  .screen>*{animation:rise .25s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
  .notif{animation:drop .45s cubic-bezier(.2,.9,.3,1.2) both}@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
}

/* ---- versión móvil independiente ---- */
html,body{height:100%}
body{padding:0;background:var(--app);overflow:hidden}
.stage{max-width:none;display:block;height:100%}
.phone{max-width:480px;width:100%;height:100%;min-height:0;margin:0 auto;border:0;border-radius:0;box-shadow:0 0 0 1px var(--line)}
.screen{padding:calc(20px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.tabs{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.notif{top:calc(10px + env(safe-area-inset-top,0px))}
@media (max-width:460px){body{padding-block:0}.phone{height:100%;overflow:hidden;background:var(--app)}.screen{overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}.tabs{position:static;margin-inline:0}.notif{position:absolute}}
.reset{align-self:center;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px}
</style>

</head>
<body>
<div class="stage">
  <div class="phone" id="phone">

/* runs one week on portfolio P (mutated). ops: manual moves recorded at decision index `at` */
function runWeek(P,sc,choices,ops,preNext,wi,vals,ledger){
  P.flags=[];
  const opsAt=i=>ops.filter(o=>o.at===i).forEach(o=>{mv(P,o.from,o.to,o.amt);if(ledger)ledger.push({w:wi,day:Math.min(i,6),kind:'op',label:o.label,delta:0});});
  choices.forEach((ch,i)=>{
    const d=sc.days[i],o=d.opts['ABC'.indexOf(ch)];
    const v0=total(P);if(d.pre)d.pre(P);const v1=total(P);opsAt(i);o.fn(P);const v2=total(P);if(d.post)d.post(P);const v3=total(P);
    for(const k in o.d)P.score[k]=clamp(P.score[k]+o.d[k]);
    if(vals)vals.push(v3);
    if(ledger){const nd=v1-v0+v3-v2;if(Math.abs(nd)>=.5)ledger.push({w:wi,day:i,kind:'news',label:d.short||'Noticia',delta:nd});
      ledger.push({w:wi,day:i,kind:'dec',label:o.t,delta:v2-v1});}
  });
  if(choices.length<7){
    if(preNext){const d=sc.days[choices.length];const v0=total(P);if(d.pre)d.pre(P);const nd=total(P)-v0;
      if(ledger&&Math.abs(nd)>=.5)ledger.push({w:wi,day:choices.length,kind:'news',label:d.short||'Noticia',delta:nd});
      if(vals&&Math.abs(nd)>=.5)vals.push(total(P));}
    opsAt(choices.length);
  }else opsAt(7);
}
function profileOf(r){const sc=r.score;
  if((sc.inv<=30&&(sc.imprev<=40||sc.conoc<=40))||(sc.imprev<=30&&sc.conoc<=40))return 'Impulsivo';
  if(sc.inv<45)return 'Especulador';
  if(r.idx>=65)return 'Equilibrado';
  if(sc.ahorro>=70)return 'Conservador';
  return 'En progreso';}

/* ---------- state helpers ---------- */
function playerSim(preNext,choicesOverride){
  const P=newP(),vals=[10000],ledger=[],weekStart=[];
  st.weeks.forEach((wk,wi)=>{weekStart.push(total(P));runWeek(P,SCENARIOS[wk.sc],wk.choices,st.ops.filter(o=>o.w===wi),false,wi,vals,ledger);});
  const cw=st.weeks.length;weekStart.push(total(P));
  if(st.sc)runWeek(P,SCENARIOS[st.sc],choicesOverride||st.choices,st.ops.filter(o=>o.w===cw),preNext,cw,vals,ledger);
  return {P,vals,ledger,value:total(P),score:P.score,idx:idxOf(P.score),weekStartVal:weekStart[cw]};
}
function botSim(i,n,preNext,includeCurrent=true){
  const P=newP();
  st.weeks.forEach(wk=>runWeek(P,SCENARIOS[wk.sc],SCENARIOS[wk.sc].bots[i].split(''),[],false,0));
  const start=total(P);
  if(includeCurrent&&st.sc)runWeek(P,SC(),SC().bots[i].slice(0,n).split(''),[],preNext,0);
  return {value:total(P),idx:idxOf(P.score),start};
}
function league(preNext,includeCurrent=true){
  const n=st.choices.length;
  const rows=BOTS.map((b,i)=>{const r=botSim(i,n,preNext,includeCurrent);return {name:b,value:r.value,idx:r.idx,start:r.start};});
  let me;
  if(includeCurrent){const r=playerSim(preNext);me={name:st.user,value:r.value,idx:r.idx,start:r.weekStartVal,me:true};}
  else{const saved=st.sc;st.sc=null;const r=playerSim(false);st.sc=saved;me={name:st.user,value:r.value,idx:r.idx,start:r.value,me:true};}
  rows.unshift(me);
  const byV=[...rows].sort((a,b)=>b.value-a.value);byV.forEach((r,i)=>r.rv=i+1);
  const byI=[...rows].sort((a,b)=>b.idx-a.idx||b.value-a.value);byI.forEach((r,i)=>r.ri=i+1);
  return byV;
}
function xpTotal(){
  const decisions=st.weeks.reduce((a,w)=>a+w.choices.length,0)+st.choices.length;
  const weeksDone=st.weeks.length+(st.choices.length===7?1:0);
  const retos=Object.values(st.retos).reduce((a,r)=>a+r.xp,0);
  return decisions*10+weeksDone*40+retos;
}
function levelInfo(){
  const xp=xpTotal(),base=LEVELS.indexOf(st.level);
  const li=Math.min(2,base+Math.floor(xp/XP_LEVEL));
  return {xp,li,key:LEVELS[li],name:LEVEL[LEVELS[li]].n,into:li===2?XP_LEVEL:xp%XP_LEVEL,next:li<2?LEVEL[LEVELS[li+1]].n:null};
}
function checkLevelUp(){const L=levelInfo();if(L.li>st.shownLevel){st.shownLevel=L.li;setTimeout(()=>toast(`¡Subes a nivel ${L.name}! Insignia activada en tu perfil`),60);}}

function bankChart(vals,ledger){
  const w=330,h=150,padL=10,padR=10,top=30,bot=26;
  const mn=Math.min(...vals,10000),mx=Math.max(...vals,10000);const span=Math.max(mx-mn,300);
  const x=i=>padL+i*(w-padL-padR)/Math.max(1,vals.length-1);
  const y=v=>top+(h-top-bot)*(1-(v-mn)/span);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${pts[0]} L${pts.join(' L')} L${x(vals.length-1).toFixed(1)},${h-bot} L${x(0).toFixed(1)},${h-bot} Z`;
  // worst movement marker
  let ann='';
  const worst=ledger.filter(l=>l.delta<=-40).sort((a,b)=>a.delta-b.delta)[0];
  if(worst&&vals.length>2){let k=0;let cnt=0;
    // find point index: count points produced up to that entry
    k=Math.min(vals.length-1,worst.w*7+worst.day+1);
    const ax=x(k),ay=y(vals[k]);const lbl=`${worst.label.length>18?worst.label.slice(0,17)+'…':worst.label} ${signed(worst.delta)}`;
    const anchor=ax<110?'start':ax>220?'end':'middle';const ly=ay+22<h-bot?ay+20:ay-12;
    ann=`<circle cx="${ax}" cy="${ay}" r="5" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/><text x="${ax}" y="${ly}" fill="var(--coral-text)" font-size="11" font-weight="700" text-anchor="${anchor}">${esc(lbl)}</text>`;}
  const last=vals.length-1;
  let labels='';
  const weeks=Math.ceil((vals.length-1)/7);
  if(weeks<=1){labels=DAY1.map((d,i)=>`<text x="${padL+(i+1)*(w-padL-padR)/7}" y="${h-6}" fill="var(--muted)" font-size="11" text-anchor="middle">${d}</text>`).join('');}
  else{for(let k=0;k<weeks;k++){labels+=`<text x="${x(Math.min(last,k*7+3.5))}" y="${h-6}" fill="var(--muted)" font-size="11" text-anchor="middle">Sem ${k+1}</text>`;}}
  return `<div class="top" style="font-size:13px"><span class="muted">Inicio <b style="color:var(--fg)" class="num">10.000 C</b></span><span class="muted">Hoy <b class="num ${cls(vals[last]-10000)}">${cur(vals[last])}</b></span></div>
  <svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución del patrimonio de 10.000 a ${fmt(vals[last])} Curritos">
   <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6F432" stop-opacity=".28"/><stop offset="1" stop-color="#C6F432" stop-opacity="0"/></linearGradient></defs>
   <line x1="${padL}" x2="${w-padR}" y1="${y(10000)}" y2="${y(10000)}" stroke="var(--line)" stroke-dasharray="4 4"/>
   <path d="${area}" fill="url(#ga)"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="var(--lime)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(last)}" cy="${y(vals[last])}" r="5" fill="var(--lime)"/>
   ${ann}${labels}
  </svg>`;}

function repartoData(){const sums={nec:0,ocio:0,aho:0};let totalAmt=0;

function analysis(r){
  const a=r.P.a,gross=Object.values(a).reduce((x,y)=>x+y,0);const out=[];
  const top=Object.entries(a).filter(([k])=>!['cash','ahorro','fondo'].includes(k)).sort((p,q)=>q[1]-p[1])[0];
  if(top&&top[1]/gross>.4)out.push(['warn',`El ${Math.round(top[1]/gross*100)} % de tu dinero está en ${ASSET_NAME[top[0]]}. Si cae, arrastra toda tu cartera.`]);
  if(a.cash/gross>.4)out.push(['warn',`Tienes el ${Math.round(a.cash/gross*100)} % en efectivo. La inflación le resta valor cada semana.`]);
  if(r.P.deuda>0)out.push(['warn',`Debes ${cur(r.P.deuda)}. Págalo antes de invertir más: la deuda tiene coste.`]);
  if(a.ahorro<1000)out.push(['warn','Tu colchón de emergencia está por debajo de 1.000 C. Un imprevisto te obligaría a vender o endeudarte.']);
  else out.push(['ok',`Tienes ${cur(a.ahorro)} de colchón en la cuenta de ahorro para imprevistos.`]);
  if(a.fondo/gross>.25)out.push(['ok',`El ${Math.round(a.fondo/gross*100)} % está en un fondo indexado: diversificado y a largo plazo.`]);
  return out.slice(0,3);}

function splitFeedback(s){const [n,o,a]=s;const out=[];
  if(a>=20)out.push(`Ahorras un ${a} %: cumples la regla del 20 %.`);else out.push(`Solo ahorras un ${a} %. Lo recomendable es un 20 %.`);
  if(o>35)out.push('El ocio se lleva más de un tercio. Ojo con los caprichos.');
  if(n<40)out.push('¿Seguro que cubres lo necesario con menos del 40 %?');
  return out;}
function splitXP(s){const dist=SPLIT_KEYS.reduce((t,k,i)=>t+Math.abs(s[i]-TARGET[k]),0);return Math.round(20+30*Math.max(0,1-dist/60));}

  <div><div class="muted" style="font-size:13px">Informe semanal · Semana ${weekNo()} · ${sc.name}</div><h2 style="font-size:26px">Así ha ido tu semana, @${esc(st.user)}</h2></div>
  <div class="hero-money"><span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Patrimonio al cierre</span><span class="amt num">${cur(r.value)}</span>
   <span class="num" style="font-weight:700">${signed(weekDelta)} esta semana · ${pctOf(r.value-10000,10000)} desde el inicio</span></div>
  <div class="grid2">
   <div class="tile"><span class="muted" style="font-size:12px">Ranking patrimonio</span><b class="num">${me.rv}.º <span class="muted" style="font-size:13px;font-family:var(--body);font-weight:500">de 6</span></b></div>
   <div class="tile"><span class="muted" style="font-size:12px">Salud financiera</span><b class="num up">${r.idx} <span class="muted" style="font-size:13px;font-family:var(--body);font-weight:500">/100 · ${me.ri}.º</span></b></div>
  </div>
  <div class="card" style="gap:0">
   <span class="eyebrow" style="margin-bottom:6px">Resumen de movimientos</span>
   <div class="row"><span>Noticias y mercado</span><b class="num ${cls(mk)}">${signed(mk)}</b></div>
   <div class="row"><span>Tus decisiones (gastos, ingresos y deudas)</span><b class="num ${cls(dc)}">${signed(dc)}</b></div>
   <div class="row"><span><b>Total de la semana</b></span><b class="num ${cls(weekDelta)}">${signed(weekDelta)}</b></div>
  </div>
  <div class="card" style="gap:0">
   <span class="eyebrow" style="margin-bottom:6px">Día a día</span>
   ${st.choices.map((c,i)=>{const items=wk.filter(l=>l.day===i);const d=items.reduce((a,l)=>a+l.delta,0);const dec=items.find(l=>l.kind==='dec');
     return `<div class="row"><span style="min-width:0"><b style="color:var(--violet-soft)">${DAY1[i]}</b>  ${esc(dec?dec.label:'')}${items.some(l=>l.kind==='news')?`<br><span class="muted" style="font-size:12px">${esc(items.find(l=>l.kind==='news').label)}</span>`:''}</span><span class="num ${Math.abs(d)<.5?'muted':cls(d)}" style="white-space:nowrap">${Math.abs(d)<.5?'0 C':signed(d)}</span></div>`;}).join('')}
  </div>
  <div class="card" style="gap:10px">
   <span class="eyebrow" style="display:flex;gap:6px;align-items:center">${ICON.spark} Análisis de la situación</span>
   <span style="font-size:14px">${weekDelta>=avg?'Has superado':'Te has quedado por debajo de'} la media de tu liga esta semana (${signed(avg)}).</span>
   <span style="font-size:14px">${keyTxt}</span>
   ${an.map(([t,m])=>`<div class="${t}">${t==='ok'?ICON.check:ICON.alert}<span>${m}</span></div>`).join('')}
   <span style="font-size:14px"><b>Para la próxima semana:</b> tu indicador más bajo es ${IND_NAME[weakest].toLowerCase()} (${r.score[weakest]}). ${IND_TIP[weakest]}</span>
  </div>
  <div class="card news"><span class="eyebrow">Tu personalidad financiera</span><b style="font-family:var(--display);font-size:24px">${p}</b><span style="font-size:14px;font-weight:500">${INSIGHT[p]}</span></div>
  <div class="card"><span class="eyebrow" style="color:var(--muted)">Lo que pasó en la realidad</span><span style="font-size:14px">${sc.real}</span></div>
  <button class="btn" data-act="go" data-to="ranking">Ver la clasificación final</button>`;};

V.ranking=()=>{
  const lg=league(false);const prev=st.weeks.length?league(false,false):null;
  const prevPos=prev?Object.fromEntries(prev.map(x=>[x.name,x.rv])):null;
  const champ=[...lg].sort((a,b)=>(a.rv+a.ri)-(b.rv+b.ri)||b.value-a.value)[0];
  const me=lg.find(x=>x.me);
  const pod=[lg[1],lg[0],lg[2]];const H=[92,124,72];const C=['var(--silver)','var(--gold)','var(--bronze)'];const P=[2,1,3];
  const mvTxt=x=>{if(!prevPos)return '<span class="mveq">—</span>';const d=prevPos[x.name]-x.rv;return d>0?`<span class="mvup">▲ ${d}</span>`:d<0?`<span class="mvdn">▼ ${-d}</span>`:'<span class="mveq">=</span>';};
  return `<button class="back" data-act="backLiga">${ICON.back} Liga</button>
  <div><div class="muted" style="font-size:13px">Liga Valencia Sub-25 · Semana ${weekNo()} cerrada</div><h2 style="font-size:26px">Clasificación final</h2></div>
  <div class="podium" aria-label="Podio de la semana">${pod.map((x,i)=>`<div class="pod ${x.me?'me':''}"><div class="av">${esc(x.name[0].toUpperCase())}</div><span class="nm">@${esc(x.name)}</span><span class="val num">${cur(x.value)}</span><div class="step" style="height:${H[i]}px;background:${C[i]}">${P[i]}</div></div>`).join('')}</div>
  <div class="card news" style="gap:4px"><span class="eyebrow">Campeón de la semana</span><b style="font-family:var(--display);font-size:20px">@${esc(champ.name)}${champ.me?' (¡tú!)':''}</b><span style="font-size:13px;font-weight:500">Mejor combinación de patrimonio y salud financiera: ${cur(champ.value)} · ${champ.idx}/100</span></div>
  <div class="card" style="gap:0">
   <div class="row muted" style="font-size:12px"><span>Jugador</span><span>Patrimonio · salud · cambio</span></div>
   ${lg.map(x=>`<div class="row" style="${x.me?'color:var(--lime);font-weight:700':''}"><span>${x.rv}  @${esc(x.name)}${x.me?' (tú)':''}</span><span class="num" style="display:flex;gap:10px;align-items:center">${cur(x.value)} · ${x.idx} ${mvTxt(x)}</span></div>`).join('')}
  </div>
  <div class="tip"><span>${me.rv<=3?`Estás en el podio. `:''}${prevPos?`La semana pasada ibas ${prevPos[st.user]}.º; ahora vas ${me.rv}.º.`:'Es la primera semana: las flechas de subida y bajada aparecen a partir de la semana 2.'}</span></div>
  <button class="btn" data-act="share">Compartir resultado con mi liga</button>
  <button class="btn alt" data-act="go" data-to="ligas">Jugar la semana ${weekNo()+1}</button>`;};

/* ---------- render & events ---------- */
let toastT;
function toast(msg){let t=$phone.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');$phone.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}
function renderNotif(){
  let n=$phone.querySelector('.notif');
  if(!st.notif){if(n)n.remove();return;}
  const r=playerSim(false),lg=league(false),me=lg.find(x=>x.me);
  const html=`<div class="logo" aria-hidden="true">FL</div><div class="notif-t"><div class="notif-h"><span>Finan League</span><span>ahora</span></div>
   <b>Semana ${weekNo()} cerrada: tu informe está listo</b><span class="num">Acabas con ${cur(r.value)} (${signed(r.value-r.weekStartVal)}) y vas ${me.rv}.º de 6 en tu liga.</span></div>`;
  if(!n){n=document.createElement('button');n.className='notif';n.dataset.act='openNotif';$phone.appendChild(n);}
  n.innerHTML=html;n.setAttribute('aria-label','Notificación: semana cerrada, abrir informe');
}
function render(keepScroll){
  const y=$screen.scrollTop;
  $screen.innerHTML=V[st.screen]();
  $tabs.hidden=!(st.screen==='semana'&&st.sc);
  $tabs.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===st.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $screen.scrollTop=keepScroll?y:0;
  renderNotif();
  const f=document.getElementById('reg');
  if(f)f.addEventListener('submit',e=>{e.preventDefault();st.user=(document.getElementById('f-user').value.trim()||'lucia_fl').replace(/^@/,'');st.email=document.getElementById('f-email').value;go('quiz');});
  checkLevelUp();
  try{localStorage.setItem('finanleague-proto',JSON.stringify(st));}catch(e){}
}
function go(s){st.screen=s;st.panel=null;render();}
function startSc(id){
  if(st.sc&&st.choices.length===7)st.weeks.push({sc:st.sc,choices:[...st.choices]});
  else st.ops=st.ops.filter(o=>o.w!==st.weeks.length);
  Object.assign(st,{sc:id,choices:[],sel:null,phase:'decide',tab:'liga',closed:false,notif:false,panel:null});
  go('semana');
}
function addOp(from,to,amt,label){st.ops.push({w:st.weeks.length,at:st.choices.length,from,to,amt,label});}

document.addEventListener('input',e=>{
  const m=e.target.id&&e.target.id.match(/^sl-(\d)$/);if(!m)return;
  const r=RETOS.find(x=>x.id===st.reto);const i=+m[1];const v=+e.target.value;
  const others=[0,1,2].filter(k=>k!==i);const rem=100-v;const s=st.split;const sum=s[others[0]]+s[others[1]];
  let a=sum>0?Math.round(rem*s[others[0]]/sum/5)*5:Math.round(rem/2/5)*5;a=Math.max(0,Math.min(rem,a));
  s[i]=v;s[others[0]]=a;s[others[1]]=rem-a;
  [0,1,2].forEach(k=>{const el=document.getElementById('sl-'+k);if(k!==i)el.value=s[k];el.setAttribute('aria-valuetext',s[k]+' %');
    document.getElementById('sl-v-'+k).textContent=cur(s[k]/100*r.amt);document.getElementById('sl-p-'+k).textContent=s[k]+' %';});
  document.querySelectorAll('#sp-bar i').forEach((el,k)=>el.style.width=s[k]+'%');
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.tab){st.tab=b.dataset.tab;st.reto=null;st.panel=null;if(st.screen!=='semana')st.screen='semana';render();return;}
  const a=b.dataset.act;
  if(a==='video'){const m=document.createElement('div');m.className='vmodal';m.innerHTML='<video src="video.mp4" poster="poster.jpg" controls autoplay playsinline></video><button class="vclose" data-act="closeVideo" aria-label="Cerrar vídeo">×</button>';$phone.appendChild(m);return;}
  if(a==='closeVideo'){const m=$phone.querySelector('.vmodal');if(m)m.remove();return;}
  if(a==='go')go(b.dataset.to);
  else if(a==='qpick'){st.qsel=+b.dataset.i;render(true);}
  else if(a==='qnext'){st.qscore+=QUIZ[st.qi].o[st.qsel][1];st.qsel=null;
    if(st.qi<QUIZ.length-1){st.qi++;render();}else{st.level=st.qscore<=3?'B':st.qscore<=7?'I':'A';st.shownLevel=LEVELS.indexOf(st.level);go('nivel');}}
  else if(a==='copy'){try{navigator.clipboard.writeText('FNL-482').then(()=>toast('Código FNL-482 copiado'),()=>toast('Tu código es FNL-482'));}catch(err){toast('Tu código es FNL-482');}}
  else if(a==='share'){const me=league(false).find(x=>x.me);const txt=`Semana ${weekNo()} en Finan League: acabo ${me.rv}.º con ${cur(me.value)}. ¿Me superas? Código FNL-482`;
    try{navigator.clipboard.writeText(txt).then(()=>toast('Resultado copiado para compartir'),()=>toast(txt));}catch(err){toast(txt);}}
  else if(a==='pickSc')startSc(b.dataset.id);
  else if(a==='resume'){st.tab='liga';go('semana');}
  else if(a==='pick'){st.sel=+b.dataset.i;render(true);}
  else if(a==='confirm'&&st.sel!=null){st.choices.push('ABC'[st.sel]);st.sel=null;st.phase='result';render(true);}
  else if(a==='next'){if(st.choices.length>=7){st.closed=true;st.notif=true;render();}else{st.phase='decide';render();}}
  else if(a==='openNotif'){st.notif=false;go('informe');}
  else if(a==='backLiga'){st.tab='liga';go('semana');}
  else if(a==='panel'){st.panel=st.panel===b.dataset.p?null:b.dataset.p;render(true);}
  else if(a==='save'){const r=playerSim(st.phase==='decide'&&st.choices.length<7);const amt=b.dataset.amt==='all'?r.P.a.cash:Math.min(+b.dataset.amt,r.P.a.cash);
    if(amt<1){toast('No tienes efectivo disponible');return;}addOp('cash','ahorro',amt,`Ahorro: ${cur(amt)} a la cuenta de ahorro`);st.panel=null;render(true);toast(`${cur(amt)} pasados a tu cuenta de ahorro`);}
  else if(a==='doMove'){const from=document.getElementById('mv-from').value,to=document.getElementById('mv-to').value,amt=+document.getElementById('mv-amt').value;
    const r=playerSim(st.phase==='decide'&&st.choices.length<7);
    if(from===to){toast('Elige dos activos distintos');return;}
    if(!(amt>0)){toast('Escribe una cantidad mayor que 0');return;}
    const real=Math.min(amt,r.P.a[from]);addOp(from,to,real,`${ASSET_NAME[from]} → ${ASSET_NAME[to]}: ${cur(real)}`);st.panel=null;render(true);toast(`Movidos ${cur(real)} a ${ASSET_NAME[to]}`);}
  else if(a==='doGoal'){const name=document.getElementById('g-name').value.trim(),amt=+document.getElementById('g-amt').value;
    if(!name){toast('Escribe para qué ahorras');return;}if(!(amt>=100)){toast('La meta debe ser de al menos 100 C');return;}
    st.goal={name,amt};st.panel=null;render(true);toast('Meta creada');}
  else if(a==='allMoves'){st.allMoves=!st.allMoves;render(true);}
  else if(a==='openReto'){st.reto=b.dataset.id;st.split=[50,30,20];st.cap=[];st.tr=[];render();}
  else if(a==='closeReto'){st.reto=null;render();}
  else if(a==='doSplit'){const s=[...st.split];const xp=splitXP(s);st.retos[st.reto]={xp,split:s};render(true);toast(`+${xp} XP`);}
  else if(a==='cap'){st.cap[+b.dataset.i]=+b.dataset.j;render(true);}
  else if(a==='doCap'){const r=RETOS.find(x=>x.id==='capricho');const ok=r.items.filter((it,i)=>st.cap[i]===it[1]).length;st.retos.capricho={xp:ok*8,ok,ans:[...st.cap]};render(true);toast(`+${ok*8} XP`);}
  else if(a==='tr'){st.tr[+b.dataset.i]=+b.dataset.j;render(true);}
  else if(a==='doTr'){const r=RETOS.find(x=>x.id==='trampa');const ok=r.qs.filter((q,i)=>st.tr[i]===q.c).length;st.retos.trampa={xp:ok*20,ok,ans:[...st.tr]};render(true);toast(`+${ok*20} XP`);}
  else if(a==='reset'){Object.assign(st,FRESH());render();}
  else if(a==='jump-liga'){go('ligas');}
  else if(a==='jump-cierre'){Object.assign(st,{sc:'opep',choices:'BBABCBC'.split(''),phase:'result',closed:true,notif:true,tab:'liga',reto:null,panel:null});
    st.ops=st.ops.filter(o=>o.w!==st.weeks.length);go('semana');}
});

(function boot(){
  try{const saved=JSON.parse(localStorage.getItem('finanleague-proto')||'null');
    if(saved&&saved.screen&&V[saved.screen]&&Array.isArray(saved.weeks)&&(!saved.sc||SCENARIOS[saved.sc]))Object.assign(st,saved,{notif:saved.notif&&saved.closed});}catch(e){}
  render();
})();
</script>

</body>
</html>
